# === ОБЩИЕ БЛОКИ ДЛЯ HTTP (port 80) ===

# makeusbeautiful.ru — основной сайт
server {
    listen 80;
    server_name makeusbeautiful.ru www.makeusbeautiful.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# presentations.makeusbeautiful.ru — презентации
server {
    listen 80;
    server_name presentations.makeusbeautiful.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# === HTTPS: основной сайт ===

server {
    listen 443 ssl;
    server_name makeusbeautiful.ru www.makeusbeautiful.ru;

    ssl_certificate /etc/letsencrypt/live/makeusbeautiful.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makeusbeautiful.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# === HTTPS: презентации ===

server {
    listen 443 ssl;
    server_name presentations.makeusbeautiful.ru;

    ssl_certificate /etc/letsencrypt/live/presentations.makeusbeautiful.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/presentations.makeusbeautiful.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/presentations-mb;
    index index.html;

    # Презентация компании
    location /company/ {
        try_files $uri $uri/ /company/index.html;
    }

    # Кеширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Корень → редирект на первую презентацию
    location = / {
        return 301 https://$host/company/;
    }
}
