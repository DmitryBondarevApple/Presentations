server {
    listen 80;
    server_name presentations.makeusbeautiful.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name presentations.makeusbeautiful.ru;

    ssl_certificate /etc/letsencrypt/live/presentations.makeusbeautiful.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/presentations.makeusbeautiful.ru/privkey.pem;

    root /usr/share/nginx/html/presentations-mb;
    index index.html;

    location /company/ {
        try_files $uri $uri/ /company/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /company-light/ {
        try_files $uri $uri/ /company-light/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = / {
        return 301 https://$host/company/;
    }
}
