# Nginx-конфиг для presentations.noteall.ru
# Расположение на сервере: /etc/nginx/presentations.conf
# Монтируется как volume в Docker-контейнер

server {
    listen 80;
    server_name presentations.noteall.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name presentations.noteall.ru;

    ssl_certificate /etc/letsencrypt/live/presentations.noteall.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/presentations.noteall.ru/privkey.pem;

    root /usr/share/nginx/html/presentations;
    index index.html;

    # FranchCamp
    location /franchcamp/ {
        try_files $uri $uri/ /franchcamp/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Emergent Masterclass
    location /emergent/ {
        try_files $uri $uri/ /emergent/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Noteall Invest
    location /invest/ {
        try_files $uri $uri/ /invest/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Noteall One Pager
    location /onepager/ {
        try_files $uri $uri/ /onepager/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # AX10
    location /ax10/ {
        try_files $uri $uri/ /ax10/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Статика (JS, CSS, медиа) — долгий кэш
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Корень — редирект на основной сайт
    location = / {
        return 301 https://noteall.ru;
    }
}
